server.name: kibana
server.host: "0.0.0.0"
server.publicBaseUrl: "https://localhost:5601"

server.ssl.enabled: true
server.ssl.certificate: /usr/share/kibana/config/certs/kibana/kibana.crt
server.ssl.key: /usr/share/kibana/config/certs/kibana/kibana.key

elasticsearch.hosts: ["https://es-hot:9200"]
elasticsearch.username: "kibana_system"
elasticsearch.password: "${KIBANA_PASSWORD}"
elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca.crt"]
elasticsearch.ssl.verificationMode: full

xpack.encryptedSavedObjects.encryptionKey: "${KIBANA_ENC_KEY_SO}"
xpack.security.encryptionKey: "${KIBANA_ENC_KEY_SEC}"
xpack.reporting.encryptionKey: "${KIBANA_ENC_KEY_REP}"
