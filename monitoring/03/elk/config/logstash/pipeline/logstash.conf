input {
  # Filebeat -> Logstash, взаимная TLS-аутентификация
  beats {
    id => "in_beats"
    port => 5044
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.key"
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]
    ssl_client_authentication => "required"
  }

  # Приём JSON-сообщений по TCP (одно JSON-событие на строку), mTLS
  tcp {
    id => "in_tcp_json"
    port => 5000
    codec => json_lines
    tags => ["tcp_json"]
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/certs/logstash/logstash.crt"
    ssl_key => "/usr/share/logstash/config/certs/logstash/logstash.key"
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]
    ssl_client_authentication => "required"
  }
}

filter {
  if "tcp_json" in [tags] {
    mutate { add_field => { "[event][dataset]" => "tcp.json" } }
  } else if [container][labels][com_docker_compose_service] == "pinger" {
    # Формат logging по умолчанию: LEVEL:logger:message
    grok {
      id => "grok_pinger"
      match => { "message" => "^%{LOGLEVEL:[log][level]}:%{DATA:[log][logger]}:%{GREEDYDATA:[app][message]}" }
      tag_on_failure => ["_grok_pinger_failure"]
    }
  } else if [message] =~ /^\{/ {
    # Контейнеры, которые сами пишут JSON (ES, Kibana и т.п.) — в отдельное поле, без конфликтов с ECS
    json {
      id => "json_container"
      source => "message"
      target => "[app]"
      skip_on_invalid_json => true
    }
  }
}

output {
  elasticsearch {
    id => "out_es"
    hosts => ["https://es-hot:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/usr/share/logstash/config/certs/ca.crt"]
    index => "logstash-%{+yyyy.MM.dd}"
    action => "create"          # append-only, достаточно привилегии create_doc
    data_stream => false
    manage_template => false    # шаблон и ILM создаёт setup
    ilm_enabled => false        # иначе плагин подменит index на rollover alias
  }
}
